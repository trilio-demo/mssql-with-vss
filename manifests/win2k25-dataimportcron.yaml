# =============================================================================
# win2k25 golden -> catalog boot source (the "peer pull" path)
# =============================================================================
# This is how a PEER consumes the golden: not by cloning cross-namespace out of
# the build namespace, but by importing the ghcr containerDisk into
# openshift-virtualization-os-images, where the console catalog actually looks.
#
# Solves two problems at once:
#   1. DISCOVERABILITY. The console only offers boot sources from
#      openshift-virtualization-os-images. A golden sitting in the build
#      namespace is invisible in the catalog.
#   2. RBAC. Cloning from the blessed namespace is the supported path, so peers
#      no longer need the per-namespace `persistentvolumeclaims/source` grant
#      that manifests/cdi-clone-source-rbac.yaml exists to provide.
#
# DISTINCT managedDataSource name -- deliberately NOT "win2k25" -- so a
# cluster's existing (often broken/static) win2k25 boot source is left alone.
#
# PREREQ: the `ghcr-cdi` read secret must exist in BOTH namespaces:
#   openshift-virtualization-os-images  -- used by the import DataVolume
#   openshift-cnv                       -- used by this cron's digest-poll job;
#     if missing the poll job fails with
#     CreateContainerConfigError: secret "ghcr-cdi" not found
# See docs/ghcr-secret.example.yaml.
#
# NOTE: DataImportCron spec is IMMUTABLE -- retagging means DELETE AND RECREATE:
#   oc delete dataimportcron win2k25-trilio-golden -n openshift-virtualization-os-images
#   oc apply -f manifests/win2k25-dataimportcron.yaml
# Deleting the cron also garbage-collects the DataSource and its snapshot, so any
# VM mid-clone from it will fail -- do this when nothing is provisioning.
#
# The registry also carries a moving `:latest` tag pointing at the same digest.
# This cron deliberately pins the DATED tag: with a dated tag the daily poll is
# effectively import-once, so a rebake never re-imports underneath someone's
# cluster unannounced. Point at `:latest` only where auto-refresh is actually
# wanted.
# =============================================================================
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataImportCron
metadata:
  name: win2k25-trilio-golden
  namespace: openshift-virtualization-os-images
  labels:
    # Surfaces the managed DataSource as a Windows-2025 boot source, and gives
    # console-created VMs the LEAN default size without any per-VM override.
    instancetype.kubevirt.io/default-preference: windows.2k25.virtio
    instancetype.kubevirt.io/default-instancetype: u1.medium
spec:
  managedDataSource: win2k25-trilio-golden
  # Daily digest poll. With the pinned dated tag below this is effectively
  # import-once. Point at a moving tag (:latest) for auto-refresh per re-bake.
  schedule: "0 6 * * *"
  garbageCollect: Outdated
  importsToKeep: 2
  template:
    spec:
      source:
        registry:
          url: "docker://ghcr.io/trilio-demo/win2k25-golden:2026-08-25"
          secretRef: ghcr-cdi
      storage:
        # Ceph RBD virtualization class -> Block/RWX, no filesystem overhead.
        storageClassName: ocs-storagecluster-ceph-rbd-virtualization
        resources:
          requests:
            # EXACTLY the golden's virtual size -- 32Gi as of win2k25-v6.
            # Do not inflate beyond the golden: a clone can never be smaller
            # than its source, so padding here raises the floor for every VM
            # built from it. Do not shrink it either -- the import would fail.
            storage: 32Gi
